<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Parking AI Dashboard</title>
  
  <!-- UI Framework (Tailwind CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font & Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Teachable Machine & TensorFlow.js Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #020617);
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glow-blue {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
    }
    .glow-green {
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
    }
    .glow-red {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- HEADER UTAMA -->
    <header class="glass-card rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 border-l-4 border-l-blue-500">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-blue-500/10 rounded-xl text-blue-400 border border-blue-500/20">
          <i class="fa-solid fa-square-parking text-3xl"></i>
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold font-orbitron tracking-wider bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
            SMART PARKING AI
          </h1>
          <p class="text-xs text-slate-400 flex items-center gap-2 mt-1">
            <span class="inline-block w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
            Real-Time IoT & Machine Learning System
          </p>
        </div>
      </div>

      <!-- STATUS & TOMBOL FIREBASE -->
      <div class="flex items-center gap-3 bg-slate-900/80 p-2.5 px-4 rounded-xl border border-slate-800">
        <div class="flex items-center gap-2.5">
          <span id="firebase-dot" class="w-3 h-3 rounded-full bg-red-500"></span>
          <div class="text-left">
            <p class="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Database</p>
            <p id="firebase-status-text" class="text-xs font-bold text-red-400 font-orbitron">OFFLINE</p>
          </div>
        </div>
        <button id="btn-toggle-firebase" onclick="toggleFirebaseConnection()" class="ml-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-semibold transition shadow-lg hover:shadow-blue-500/25">
          <i class="fa-solid fa-plug mr-1"></i> Connect
        </button>
      </div>
    </header>

    <!-- METRICS STATISTIK -->
